<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#3a2215">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Brewing Time">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Filter coffee recipe book with a guided brew timer">
<title>Brewing Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* VOICE: calm brew-bar tool, precise like a barista's scale, warm not fussy
   IDEA: a roaster's recipe card + the brew scale's readout
   PICTURE: the pour curve (water over time) on every recipe; a timer ring in brew mode
   COLOUR and TYPE: dark-roast brown band, white paper, coffee-cherry red accent; Big Shoulders numbers, Manrope text
   LAYOUT: recipe shelf left, recipe card right; stacks to one column on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f7f3ee,#120e0b);--paper:light-dark(#fff,#1c1612);--ink:light-dark(#24170e,#f2e9df);
--mute:light-dark(#76665a,#a99786);--line:light-dark(#e7ddd2,#33291f);--kraft:light-dark(#efe2cf,#2c2119);
--head:light-dark(#3a2215,#1f1610);--headink:#f6ece2;--acc:light-dark(#c2372a,#ff6f5a);--accink:#fff;
--num:'Big Shoulders Display',Impact,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Manrope,system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600;text-decoration:none;font-size:15px}
button:hover,.btn:hover{border-color:var(--mute)}
.pri{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.pri:hover{filter:brightness(1.08);border-color:var(--acc)}
.ghost{background:transparent;border-color:transparent}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,select,textarea{width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:16px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;color:var(--mute)}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-weight:500}
.top{background:var(--head);color:var(--headink);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px max(3vw,16px)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand b{font:800 28px/1 var(--num);letter-spacing:.02em}
.top .btn,.top button{background:transparent;color:var(--headink);border-color:#ffffff40}
.top .pri{background:var(--acc);border-color:var(--acc)}
#store{font-size:13px;opacity:.8;width:100%;order:9}
@media(min-width:700px){#store{width:auto;order:0}}
.shell{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);max-width:1320px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:18px;min-height:calc(100vh - 64px)}
#main{padding:clamp(18px,3vw,40px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{min-height:34px;padding:0 12px;border-radius:99px;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.item{display:block;padding:12px 14px;border-radius:12px;text-decoration:none;border:1px solid transparent;margin-bottom:4px}
.item:hover{background:var(--paper)}
.item.on{background:var(--paper);border-color:var(--line);box-shadow:inset 4px 0 0 var(--acc)}
.item b{display:block;font-size:16px}
.item small{color:var(--mute);font-size:13px;display:block}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--kraft)}
.star{color:var(--acc)}
h1{font:800 clamp(34px,5vw,52px)/1.05 var(--num);margin:8px 0 6px;text-wrap:balance}
h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--mute)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--paper);padding:12px 14px}
.stat span{display:block;font-size:13px;color:var(--mute);font-weight:600}
.stat b{font:800 30px/1.1 var(--num);white-space:nowrap}
.stat b.sc{color:var(--acc)}
.stat small{font-size:13px;color:var(--mute)}
.scale{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:14px 0;padding:10px 12px;background:var(--kraft);border-radius:12px;font-size:15px;font-weight:600}
.scale input{width:92px;min-height:40px;background:var(--paper)}
.scale button{min-height:40px;padding:0 12px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.fig{position:relative;min-height:240px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px}
.grid2 .card{margin-top:18px}
dl{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:0}
dt{color:var(--mute);font-size:14px}dd{margin:0;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.notes{white-space:pre-wrap}
fieldset{border:1px solid var(--line);border-radius:16px;padding:18px;margin:0 0 18px;background:var(--paper)}
legend{font-weight:700;padding:0 6px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.f .wide{grid-column:1/-1}
.srow{display:grid;grid-template-columns:110px 150px 76px 84px 84px minmax(0,1fr) auto;gap:8px;align-items:end;padding:10px 0;border-bottom:1px dashed var(--line)}
.srow .acts{display:flex;gap:4px}.srow .acts button{min-width:44px;padding:0}
.total{font-size:14px;font-weight:600;margin:10px 0}
.total.off{color:var(--acc)}
.empty{max-width:520px;margin:6vh auto;text-align:center}
.empty svg{width:min(260px,70%);height:auto}
.back{display:none;margin-bottom:6px}
#brew{position:fixed;inset:0;background:var(--head);color:var(--headink);z-index:20;display:flex;flex-direction:column;overflow:auto}
#brew[hidden],#modal[hidden]{display:none}
.bwrap{max-width:980px;margin:0 auto;width:100%;padding:16px max(4vw,16px) 28px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:center;flex:1}
.ring{position:relative;aspect-ratio:1;max-width:440px;width:100%;margin:0 auto}
.ring svg{width:100%;height:100%}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18%}
.ring .el{font:800 clamp(56px,11vw,96px)/1 var(--num)}
.ring .ins{font-size:clamp(18px,2.4vw,24px);font-weight:700;margin-top:6px}
.ring .ins b{color:#ff8a76}
.ring .nxt{font-size:15px;font-weight:600;margin-top:8px;padding:4px 12px;border-radius:99px;background:#ffffff14}.ring .nxt:empty{display:none}.ring .nxt b{font-variant-numeric:tabular-nums}.ring .nxt .amt::before{content:' · '}
.ring .nxt.soon{background:#ff8a76;color:#2a1a10}
.ring .sub{font-size:14px;opacity:.75}
.pourv{display:grid;grid-template-columns:minmax(130px,230px) minmax(0,1fr);gap:18px;align-items:center;background:#ffffff12;border-radius:18px;padding:12px;margin-bottom:14px}
.pourv canvas{width:100%;aspect-ratio:1;display:block}
.pourv b{display:block;font:800 24px/1.1 var(--num);color:#ff8a76}
.pourv span{display:block;font-size:15px;opacity:.85;margin-top:4px}
.blist{list-style:none;margin:0;padding:0}
.blist li{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;padding:10px 12px;border-radius:10px;opacity:.6}
.bhint{font-size:14px;opacity:.75;margin:0 0 8px 4px}#brew.running .bhint{display:none}
#brew:not(.running) .blist li{cursor:pointer;opacity:.85}#brew:not(.running) .blist li:hover{background:#ffffff10}
.blist li.pv{background:#ffffff22;opacity:1;box-shadow:inset 4px 0 0 #f6ece2}
.blist li.now{background:#ffffff18;opacity:1;box-shadow:inset 4px 0 0 #ff8a76}
.blist li.done{opacity:.35}
.blist .n{text-align:right;font-weight:700;white-space:nowrap}
.bctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#brew button{background:transparent;color:var(--headink);border-color:#ffffff40}
#brew button.pri{background:var(--acc);border-color:var(--acc);min-width:140px}
.bhead{display:flex;align-items:center;gap:12px;padding:12px max(4vw,16px);border-bottom:1px solid #ffffff20}
.bhead b{font:800 24px/1 var(--num);margin-right:auto}
.vsw{display:inline-flex;border:1px solid #ffffff40;border-radius:12px;padding:3px;gap:3px}
#brew .vsw button{min-height:38px;border:0;border-radius:9px;padding:0 14px}
#brew .vsw button[aria-pressed=true]{background:#f6ece2;color:#2a1a10}
.gview{display:none;position:relative;min-height:320px}.gview>svg{position:absolute;inset:0;width:100%;height:100%}
.stage.graph .ring{aspect-ratio:auto;max-width:none}.stage.graph .ring>svg{display:none}
.stage.graph .ring .c{position:static;padding:0 0 10px}.stage.graph .ring .el{font-size:clamp(48px,8vw,72px)}
.stage.graph .gview{display:block}
#modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--paper);border-radius:18px;padding:22px;width:min(560px,100%);max-height:90vh;overflow:auto}
.mbox textarea{min-height:140px;font-size:13px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:40;font-weight:600;max-width:92vw}
#toast[hidden]{display:none}
#toast button{min-height:34px;background:transparent;color:inherit;border-color:currentColor}
.sample{font-size:13px;color:var(--mute);margin-top:8px}
@media(max-width:899px){.shell{display:block}aside{border:0;min-height:0}body.focus aside{display:none}body.has:not(.focus) #main{display:none}body:not(.has) #list{display:none}.back{display:inline-flex}}
@media(max-width:1150px){.srow{grid-template-columns:repeat(4,minmax(0,1fr))}.srow .ph{display:none}.srow .note{grid-column:1/-1}.srow .acts{grid-column:1/-1;justify-content:flex-end}}
@media(max-width:700px){.gview{min-height:230px}.bhead{flex-wrap:wrap}.bhead .vsw{order:3}.bhead #bClose{order:4;margin-left:auto}.bwrap{grid-template-columns:minmax(0,1fr)}.ring{max-width:290px}.ring .c{padding:13%}.ring .nxt{font-size:13px;padding:4px 12px;border-radius:14px;line-height:1.35}.ring .nxt span{display:block;white-space:nowrap}.ring .nxt .amt::before{content:none}.bwrap{gap:16px;padding-top:10px}.bctl{margin-top:10px}.srow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.srow .note{grid-column:1/-1}.srow .acts{grid-column:1/-1;justify-content:flex-end}}
@media(max-width:600px){table{font-size:14px}.stack thead{display:none}.stack tr{display:grid;padding-block:8px;border-bottom:1px solid var(--line)}.stack td{display:flow-root;border:0;padding:3px 0;padding-inline-start:7em;text-align:start}.stack td::before{content:attr(data-l);float:inline-start;width:6.5em;margin-inline-start:-7em;color:var(--mute);font-size:13px}.stack td:empty{display:none}}
@media(prefers-reduced-motion:no-preference){.ring .arc{transition:stroke-dashoffset .25s linear}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <a class="brand" href="#">
    <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 9h28l-10 16h-8z" fill="#f6ece2"/><path d="M6 9h28l-2 3H8z" fill="#ff8a76"/><rect x="12" y="27" width="16" height="3" rx="1.5" fill="#f6ece2"/><path d="M20 32c-2 3 2 3 0 6" stroke="#ff8a76" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
    <b>Brewing Time</b>
  </a>
  <span id="store">Saved in this browser</span>
  <button id="syncBtn" type="button">Sync</button>
  <button id="backupBtn" type="button">Backup</button>
  <a class="btn pri" href="#new">+ New recipe</a>
</header>
<div class="shell">
  <aside>
    <input id="search" type="search" placeholder="Search recipes, beans, roasters…" aria-label="Search recipes">
    <div class="chips" id="chips"></div>
    <nav id="list" aria-label="Recipes"></nav>
  </aside>
  <section id="main" aria-live="polite"></section>
</div>
<div id="brew" hidden></div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" hidden></div>
<script>
{
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{s=Math.max(0,Math.round(+s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const parseT=v=>{v=String(v??'').trim();if(!v)return 0;const p=v.split(/\s*[:.,\s]\s*/);if(p.length>1){return Math.max(0,(parseInt(p[0],10)||0)*60+(parseInt(p[1],10)||0))}return Math.max(0,parseInt(v,10)||0)};
const nr=(v,d=1)=>String(Math.round((+v||0)*10**d)/10**d);
const newId=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const DEFAULT_METHODS=['V60','Kalita Wave','Chemex','Origami','Orea','April','Melitta'];
const TYPES={bloom:'Bloom',pour:'Pour',swirl:'Swirl',stir:'Stir',wait:'Wait',drawdown:'Drawdown'};
const LS='pournotes.v1';
let recipes=new Map(),customMethods=[],mode='loading',col=null,q='',mf='All',k=1,kFor=null,draft=null,mainKey='',roChart=null,toastT=null;

/* ---------- storage: this browser + GitHub Gist sync ---------- */
const LSS='pournotes.sync',FILE='pour-notes.json',API='https://api.github.com';
let deleted={},sync={},busy=false,again=false,syncT=null;
try{sync=JSON.parse(localStorage.getItem(LSS)||'{}')||{}}catch(e){sync={}}
function saveSync(){try{localStorage.setItem(LSS,JSON.stringify(sync))}catch(e){}}
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');(d.recipes||[]).forEach(r=>recipes.set(r.id,r));customMethods=d.methods||[];deleted=d.deleted||{}}catch(e){}}
function lsWrite(){try{localStorage.setItem(LS,JSON.stringify(snapshot()))}catch(e){toast('Could not save in this browser')}}
function lsSave(){lsWrite();scheduleSync(3000)}
const pending={};
function queue(id,fn){const p=(pending[id]||Promise.resolve()).then(fn,fn);pending[id]=p.catch(()=>{});return p}
function ready(){if(mode==='loading'){toast('Still loading your recipes — try again in a moment');return false}return true}
async function persist(r){
  if(!ready())return false;
  r={...r,mtime:Date.now()};recipes.set(r.id,r);delete deleted[r.id];render();
  if(mode==='db'){try{await queue(r.id,()=>col.doc(r.id).set(r))}catch(e){toast(e&&e.code==='quota_exceeded'?'Storage is full — delete some recipes first':'Could not save — please try again');return false}}
  else lsSave();
  return true}
async function removeR(id){
  if(!ready())return;
  recipes.delete(id);render();
  if(mode==='db'){try{await queue(id,()=>col.doc(id).delete())}catch(e){toast('Could not delete — please try again')}}
  else{deleted[id]=Date.now();lsSave()}}
async function saveMethods(){
  if(mode==='db'){try{await queue('prefs',()=>col.doc('prefs').set({methods:customMethods}))}catch(e){toast('Could not save the method')}}else lsSave()}
function snapshot(){return{app:'pour-notes',version:2,methods:customMethods,recipes:[...recipes.values()],deleted}}
function sig(s){return JSON.stringify([[...(s.methods||[])].sort(),(s.recipes||[]).map(r=>r.id+':'+(r.mtime||0)).sort(),Object.keys(s.deleted||{}).sort()])}
function setSync(t){$('#store').textContent=t}
function syncIdle(){setSync(sync.token?(sync.last?'Synced '+new Date(sync.last).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'Sync ready'):'Saved in this browser · sync off')}
async function gh(path,opt={}){
  const res=await fetch(API+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',Authorization:'Bearer '+sync.token,...(opt.body?{'Content-Type':'application/json'}:{})}});
  if(!res.ok){const e=new Error('GitHub '+res.status);e.status=res.status;throw e}return res.json()}
async function findOrCreate(){
  for(let p=1;p<=10;p++){const l=await gh(`/gists?per_page=100&page=${p}`);const g=l.find(x=>x.files&&x.files[FILE]);if(g)return g.id;if(l.length<100)break}
  const g=await gh('/gists',{method:'POST',body:JSON.stringify({description:'Brewing Time — coffee recipes',public:false,files:{[FILE]:{content:JSON.stringify(snapshot(),null,1)}}})});
  return g.id}
async function pullRemote(){
  const g=await gh('/gists/'+encodeURIComponent(sync.gistId));const f=g.files&&g.files[FILE];if(!f)return null;
  let txt=f.content;if(f.truncated){txt=await (await fetch(f.raw_url,{cache:'no-store'})).text()}
  try{const d=JSON.parse(txt);return d&&typeof d==='object'?d:null}catch(e){return null}}
function merge(remote){
  let changed=false;
  for(const[id,t]of Object.entries(remote.deleted||{}))if(!(deleted[id]>=t))deleted[id]=t;
  for(const x of remote.recipes||[]){if(!x||typeof x!=='object'||!/^[A-Za-z0-9_-]{1,60}$/.test(x.id||''))continue;const loc=recipes.get(x.id);if(!loc||(x.mtime||0)>(loc.mtime||0)){recipes.set(x.id,x);changed=true}}
  for(const[id,t]of Object.entries(deleted)){const r=recipes.get(id);if(r&&(r.mtime||0)<=t){recipes.delete(id);changed=true}}
  for(const m of remote.methods||[])if(typeof m==='string'&&!customMethods.includes(m)){customMethods=[...customMethods,m];changed=true}
  const old=Date.now()-180*864e5;for(const id in deleted)if(deleted[id]<old)delete deleted[id];
  return changed}
function scheduleSync(ms){if(!sync.token||mode!=='local'||onClaude)return;clearTimeout(syncT);syncT=setTimeout(doSync,ms)}
async function doSync(){
  if(mode!=='local'||onClaude)return;
  if(!sync.token)return syncIdle();
  if(busy){again=true;return}
  busy=true;setSync('Syncing…');
  try{
    if(!sync.gistId){sync.gistId=await findOrCreate();saveSync()}
    const remote=(await pullRemote())||{recipes:[],deleted:{},methods:[]};
    if(merge(remote)){lsWrite();if(!mainKey.startsWith('edit'))mainKey='';render()}
    if(sig(snapshot())!==sig(remote))await gh('/gists/'+encodeURIComponent(sync.gistId),{method:'PATCH',body:JSON.stringify({files:{[FILE]:{content:JSON.stringify(snapshot(),null,1)}}})});
    sync.last=Date.now();sync.err='';saveSync();syncIdle();
  }catch(e){
    if(e.status===404){sync.gistId='';saveSync()}
    sync.err=e.status===401?'GitHub rejected the token — open Sync to fix it':e.status===403?'GitHub refused (check the token has the gist scope)':e.status===404?'Gist not found — will create a new one':navigator.onLine===false?'Offline — will sync when back online':'Sync failed — will retry';
    setSync(sync.err);if(e.status!==401&&e.status!==403)scheduleSync(60000);
  }finally{busy=false;if(!$('#modal').hidden&&$('#syncInfo'))$('#syncInfo').innerHTML=syncInfo();if(again){again=false;scheduleSync(1500)}}}
function syncInfo(){return sync.token?`Connected on this device.${sync.gistId?` Gist: <a href="https://gist.github.com/${esc(sync.gistId)}" target="_blank" rel="noopener">${esc(sync.gistId.slice(0,10))}…</a>`:''}${sync.last?` Last sync ${esc(new Date(sync.last).toLocaleString())}.`:''}${sync.err?`<br><b>${esc(sync.err)}</b>`:''}`:'Not connected on this device.'}
function openSync(){
  modal(`<h2>Sync with GitHub Gist</h2>
  <p class="muted" style="font-size:14px">Your recipes are saved in this browser and copied to a secret gist in your GitHub account, so every device you connect stays up to date. Use a token that has only the <b>gist</b> scope: <a href="https://github.com/settings/tokens/new?scopes=gist&description=Brewing%20Time" target="_blank" rel="noopener">create one on GitHub</a>. Paste the same token on each device.</p>
  <p id="syncInfo" style="font-size:14px">${syncInfo()}</p>
  <div class="f"><label class="wide">GitHub token<input id="sTok" type="password" autocomplete="off" spellcheck="false" placeholder="${sync.token?'Saved on this device — paste to replace':'ghp_…'}"></label>
  <label class="wide">Gist ID (optional)<input id="sGist" value="${esc(sync.gistId||'')}" spellcheck="false" placeholder="Leave empty to find or create it automatically"></label></div>
  <div class="bar"><button type="button" class="pri" id="sSave">${sync.token?'Save &amp; sync now':'Connect'}</button>${sync.token?'<button type="button" id="sOff">Disconnect this device</button>':''}<button type="button" data-close>Close</button></div>`,m=>{
    m.querySelector('#sSave').onclick=()=>{const t=m.querySelector('#sTok').value.trim(),g=m.querySelector('#sGist').value.trim().replace(/^.*\//,'');
      if(!t&&!sync.token){toast('Paste a GitHub token first');return}
      if(t)sync.token=t;if(g!==(sync.gistId||'')){sync.gistId=g;sync.last=0}sync.err='';saveSync();m.querySelector('#sTok').value='';doSync()};
    const off=m.querySelector('#sOff');if(off)off.onclick=()=>{sync={};saveSync();closeModal();syncIdle();toast('Sync turned off on this device — your recipes stay here')}});
}
const onClaude=!!(window.claude&&window.claude.use);
function useLocal(){
  mode='local';lsLoad();mainKey='';
  if(onClaude){setSync('Saved in this browser only — use Backup to keep a copy')}
  else{syncIdle();doSync();
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(300)});
    window.addEventListener('online',()=>scheduleSync(300));
    setInterval(()=>{if(document.visibilityState==='visible')scheduleSync(0)},180000)}
  render()}
async function init(){
  render();
  if(!onClaude){useLocal();try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}return}
  $('#syncBtn').style.display='none';setSync('Connecting…');
  const timer=setTimeout(()=>{if(mode==='loading')setSync('Still connecting — your recipes may be out of date')},10000);
  let db=null,id=null;
  try{db=await window.claude.use('db');const u=await window.claude.use('user');id=u?await u.id():null}catch(e){}
  if(!db||!id){clearTimeout(timer);useLocal();return}
  col=db.collection('data/users/'+id);
  col.onSnapshot(snap=>{
    mode='db';const m=new Map();let cm=[];
    snap.docs.forEach(d=>{const v=d.data();if(!v)return;if(d.id==='prefs')cm=Array.isArray(v.methods)?[...v.methods]:[];else m.set(d.id,{...v,id:d.id})});
    recipes=m;customMethods=cm;
    if(!snap.metadata.fromCache){clearTimeout(timer);setSync('Saved to your Claude account')}
    if(!mainKey.startsWith('edit'))mainKey='';render();
  },()=>{clearTimeout(timer);setSync('Your saved recipes can’t be reached right now');if(mode==='loading'){mode='local';render()}});
}

/* ---------- helpers ---------- */
function allMethods(extra){const s=[...DEFAULT_METHODS,...customMethods];if(extra&&!s.includes(extra))s.push(extra);return s}
const rateOf=r=>+r.pourRate>0?+r.pourRate:6;
function cum(r,kk=1){let c=0;const rate=rateOf(r);return(r.steps||[]).map(s=>{const g=(+s.g||0)*kk;c+=g;return{...s,g,c,rate}})}

let curHash=location.hash.slice(1);

function sorted(){return[...recipes.values()].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||(b.updatedAt||0)-(a.updatedAt||0))}
function matches(r){if(mf!=='All'&&r.method!==mf)return false;if(!q)return true;const b=r.bean||{};return[r.name,r.method,b.name,b.roaster,b.origin,b.process,b.variety,r.notes].join(' ').toLowerCase().includes(q)}
function toast(msg,action,fn){const t=$('#toast');clearTimeout(toastT);t.innerHTML=`<span>${esc(msg)}</span>${action?`<button type="button" id="tAct">${esc(action)}</button>`:''}`;t.hidden=false;if(action)$('#tAct').onclick=()=>{t.hidden=true;fn()};toastT=setTimeout(()=>t.hidden=true,6000)}

/* ---------- list ---------- */
function renderList(cur){

    <b>${esc(r.name)}</b><small>${nr(r.dose)} g · ${nr(r.water,0)} g · 1:${nr(r.water/r.dose)} · ${r.temp?nr(r.temp,0)+'°C':'—'}</small>
    ${r.bean&&r.bean.name?`<small>${esc(r.bean.name)}${r.bean.roaster?' · '+esc(r.bean.roaster):''}</small>`:''}</a>`).join('')

$('#chips').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){mf=b.dataset.m;renderList(route().id)}});

/* ---------- main ---------- */
function render(){
  const rt=route();let cur=rt.id;
  if(rt.v==='home'&&matchMedia('(min-width:900px)').matches){const f=sorted()[0];if(f)cur=f.id}
  document.body.classList.toggle('focus',rt.v!=='home');document.body.classList.toggle('has',recipes.size>0||mode==='loading');
  renderList(cur);
  if(rt.v==='edit'){
    const key='edit:'+(rt.id||'new');
    if(mainKey===key&&draft)return;
    if(rt.id&&!recipes.has(rt.id)){if(mode==='loading'){$('#main').innerHTML='<p class="muted">Loading…</p>';return}nav('');return}
    draft=rt.id?JSON.parse(JSON.stringify(recipes.get(rt.id))):blank();
    mainKey=key;editor();return}
  draft=null;
  const r=cur&&recipes.get(cur);
  if(r){if(kFor!==r.id){k=1;kFor=r.id}mainKey='detail:'+r.id;detail(r);return}
  mainKey='home';
  if(rt.v==='detail'&&mode==='loading'){$('#main').innerHTML='<p class="muted">Loading…</p>';return}
  $('#main').innerHTML=emptyState();
}

function curvePts(st,T,kk){const pts=[[0,0]];let c=0;st.forEach((a,i)=>{if(!a.g)return;const nxt=st.slice(i+1).find(z=>z.g);const end=nxt?+nxt.at:T;const dur=Math.max(1,Math.min(pourDur(a,kk),end-a.at-1));pts.push([+a.at,c],[+a.at+dur,c+a.g]);c+=a.g});pts.push([T,c]);return pts}
function valAt(pts,t){for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(t<=b[0])return b[0]===a[0]?b[1]:a[1]+(b[1]-a[1])*Math.max(0,(t-a[0])/(b[0]-a[0]))}return pts[pts.length-1][1]}
const PAL_LIGHT={grid:'var(--line)',text:'var(--mute)',band:'var(--kraft)',line:'var(--acc)',ink:'var(--ink)'};
const PAL_DARK={grid:'#ffffff22',text:'#f6ece2aa',band:'#ffffff12',line:'#ff8a76',ink:'#f6ece2'};
function chartSvg(W,H,st,T,max,kk,pal,now){
  max=Math.max(1,max);const small=W<520,live=now!=null;
  const L=small?36:48,R=14,Tp=22,B=30,x=t=>L+(W-L-R)*t/T,y=g=>Tp+(H-Tp-B)*(1-g/max);
  const pts=curvePts(st,T,kk),p=pts.map((q,i)=>(i?'L':'M')+x(q[0])+','+y(q[1])).join(' ');
  const bands=st.map((a,i)=>{if(a.type!=='bloom'||!a.g)return'';const nx=st[i+1],end=nx?+nx.at:T,ws=a.at+Math.min(pourDur(a,kk),end-a.at-1);if(end-ws<2)return'';const x1=x(ws),x2=x(end);
    return`<rect x="${x1}" y="${Tp}" width="${x2-x1}" height="${H-Tp-B}" fill="${pal.band}"/>${x2-x1>64?`<text x="${(x1+x2)/2}" y="${Tp+16}" text-anchor="middle" font-size="12" font-weight="700" fill="${pal.text}">${small?'Wait':'Bloom wait'} ${fmt(end-ws)}</text>`:''}`}).join('');
  const ticks=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-R}" y1="${y(max*f)}" y2="${y(max*f)}" stroke="${pal.grid}"/><text x="${L-6}" y="${y(max*f)+4}" text-anchor="end" font-size="12" fill="${pal.text}">${nr(max*f,0)}</text>`).join('');
  const tt=Math.max(30,Math.ceil(T/(small?3:6)/30)*30);let xt='';for(let t=0;t<=T;t+=tt)xt+=`<text x="${x(t)}" y="${H-8}" text-anchor="middle" font-size="12" fill="${pal.text}">${fmt(t)}</text>`;
  const marks=st.filter(a=>a.g).map(a=>`<circle cx="${x(a.at)}" cy="${y(a.c-a.g)}" r="4" fill="${pal.line}"/>${small?'':`<text x="${x(a.at)+6}" y="${y(a.c)-6}" font-size="12" font-weight="700" fill="${pal.ink}">${nr(a.c,0)} g</text>`}`).join('');
  const area=`<path d="${p} L${x(T)},${y(0)} L${x(0)},${y(0)}Z" fill="${pal.line}" opacity=".12"/>`,line=`<path d="${p}" fill="none" stroke="${pal.line}" stroke-width="3" stroke-linejoin="round"/>`;
  if(!live)return bands+ticks+xt+area+line+marks;
  const n=Math.max(0,Math.min(T,now)),nx=x(n),v=valAt(pts,n),vy=y(v),right=nx>W-90;
  return`${bands}${ticks}${xt}<defs><clipPath id="bDone"><rect x="0" y="0" width="${nx}" height="${H}"/></clipPath></defs>
  <g opacity=".3">${area}${line}</g><g clip-path="url(#bDone)">${area}${line}</g>${marks}
  <line x1="${nx}" x2="${nx}" y1="${Tp-6}" y2="${H-B}" stroke="${pal.ink}" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="${nx}" cy="${vy}" r="9" fill="${pal.line}" stroke="${pal.ink}" stroke-width="3"/>
  <text x="${right?nx-14:nx+14}" y="${Math.max(Tp+14,vy-12)}" text-anchor="${right?'end':'start'}" font-size="16" font-weight="800" fill="${pal.ink}">${nr(v,0)} g</text>`}
function drawChart(r){
  const s=$('#chart');if(!s)return;roChart&&roChart.disconnect();
  const draw=()=>{const W=s.clientWidth,H=s.clientHeight;if(!W)return;s.innerHTML=chartSvg(W,H,cum(r,k),totalTime(r),r.water*k,k,PAL_LIGHT)};
  roChart=new ResizeObserver(draw);roChart.observe(s);

  B.level=done?0:cur?(cur.c-cur.g+cur.g*Math.min(1,(e-cur.at)/Math.max(1,pourDur(cur,B.kk))))/Math.max(1,st.length?st[st.length-1].c:1):0;
  const ins=$('#bIns'),sub=$('#bSub'),nxt=$('#bNext'),adv=B.view==='graph';
  if(done){ins.textContent='Done — enjoy your cup';sub.textContent='';nxt.textContent='';nxt.className='nxt';if(B.run){B.acc=e;B.run=false;clearInterval(B.iv);$('#brew').classList.remove('running');$('#bGo').textContent='Start';B.acc=0;B.idx=-2}return}
  // what to do now
  if(phase==='before')ins.textContent='Get ready';
  else if(phase==='pour')ins.innerHTML=`${cur.type==='bloom'?'Bloom':TYPES[cur.type]} to <b>${nr(cur.c,0)} g</b>`;
  else if(phase==='bloomwait')ins.innerHTML='Bloom · <b>wait</b>';
  else if(phase==='hold')ins.innerHTML='Hold · <b>let it drain</b>';
  else ins.textContent=TYPES[cur.type]||'Wait';
  // details only in the graph view
  if(adv&&phase==='pour')sub.innerHTML=`Scale now: <b>${nr(valAt(B.pts,e),0)} g</b> · pour ${fmt(Math.ceil(Math.min(pourDur(cur,B.kk),end-cur.at-1)-(e-cur.at)))} more`;
  else if(adv&&cur&&cur.note)sub.textContent=cur.note;
  else sub.textContent='';
  // next step, always shown
  if(nx){nxt.innerHTML=`<span>Next ${nx.g?'pour':esc((TYPES[nx.type]||'step').toLowerCase())} <b>T-${fmt(Math.ceil(nx.at-e))}</b></span>${nx.g?`<span class="amt">+${nr(nx.g,0)} g → ${nr(nx.c,0)} g</span>`:''}`}
  else nxt.innerHTML=`Finish <b>T-${fmt(Math.ceil(B.T-e))}</b>`;
  nxt.className='nxt'+(soon?' soon':'');
}
function closeBrew(){if(B){clearInterval(B.iv);try{B.ro&&B.ro.disconnect()}catch(e){}cancelAnimationFrame(B.raf);try{B.wl&&B.wl.release()}catch(e){}try{B.ac&&B.ac.close()}catch(e){}}B=null;$('#brew').hidden=true;$('#brew').innerHTML='';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(B)closeBrew()}else if(e.key===' '&&B&&e.target===document.body){e.preventDefault();$('#bGo').click()}});

/* ---------- backup ---------- */
$('#backupBtn').onclick=()=>{
  const json=JSON.stringify({app:'pour-notes',version:1,methods:customMethods,recipes:sorted()},null,1);
  modal(`<h2>Backup &amp; import</h2><p class="muted" style="font-size:14px">Copy this text and keep it somewhere safe. Paste it below later to restore.</p>
  <textarea id="bkOut" readonly aria-label="Backup text">${esc(json)}</textarea><div class="bar"><button type="button" class="pri" id="bkCopy">Copy backup</button>${onClaude?'':'<button type="button" id="bkDl">Download .json</button>'}</div>
  <label>Import recipes<textarea id="bkIn" placeholder="Paste backup text here"></textarea></label>
  <div class="bar"><button type="button" id="bkImp">Import</button><button type="button" data-close>Close</button></div>`,m=>{
    m.querySelector('#bkCopy').onclick=async()=>{const t=m.querySelector('#bkOut');try{await navigator.clipboard.writeText(t.value);toast('Backup copied')}catch(e){t.focus();t.select();toast('Select all and copy the text')}};
    if(m.querySelector('#bkDl'))m.querySelector('#bkDl').onclick=()=>{try{const u=URL.createObjectURL(new Blob([json],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='brewing-time-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(e){toast('Download not available — use Copy instead')}};
    m.querySelector('#bkImp').onclick=async()=>{let d;try{d=JSON.parse(m.querySelector('#bkIn').value)}catch(e){toast('That text isn’t a valid backup');return}
      const list=Array.isArray(d)?d:(d.recipes||[]);let n=0;
      if(Array.isArray(d.methods)){const add=d.methods.filter(x=>typeof x==='string'&&!allMethods().includes(x));if(add.length){customMethods=[...customMethods,...add];await saveMethods()}}
      for(const x of list){if(!x||typeof x!=='object'||!x.name)continue;const id=/^[A-Za-z0-9_-]{1,60}$/.test(x.id||'')&&x.id!=='prefs'?x.id:newId();
        if(await persist({...x,id,dose:+x.dose||15,water:+x.water||250,steps:Array.isArray(x.steps)?x.steps:[],bean:x.bean||{},updatedAt:x.updatedAt||Date.now()}))n++}
      closeModal();toast(`Imported ${n} recipe${n===1?'':'s'}`)}});
};

$('#syncBtn').onclick=openSync;
